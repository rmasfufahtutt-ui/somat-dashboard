name: SOMAT ingest
# Menarik sensor + prakiraan BMKG ke Neon saat dashboard tertutup. Jadwal minimum GitHub = 5 menit
# (praktisnya bisa tertunda). Dashboard tetap menarik sendiri di latar belakang saat dibuka.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
concurrency:
  group: somat-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install psycopg2-binary pandas numpy
      - run: python worker.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENSOR_SHEET_URL: ${{ secrets.SENSOR_SHEET_URL }}
          SENSOR_SHEET_READ_KEY: ${{ secrets.SENSOR_SHEET_READ_KEY }}
          SENSOR_SOURCE_TYPE: ${{ vars.SENSOR_SOURCE_TYPE || 'DUMMY' }}
          BMKG_ADM4: ${{ vars.BMKG_ADM4 }}
